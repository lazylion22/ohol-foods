<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Object Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8f9fa;
      --text-color: #212529;
      --card-bg: #ffffff;
      --border-color: #dee2e6;
      --th-bg: #f1f3f5;
      --th-hover: #e9ecef;
      --accent-color: #0059ff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --th-bg: #2a2a2a;
      --th-hover: #333333;
      --accent-color: #4365ffd8;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem;
      background: var(--bg-color);
      color: var(--text-color);
      transition: var(--transition);
      line-height: 1.5;
      margin: 0;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    h2 {
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--accent-color);
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: var(--transition);
      padding: 0;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-color);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    th,
    td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    tr:last-child td {
      border-bottom: none;
    }

    th {
      cursor: pointer;
      background: var(--th-bg);
      font-weight: 600;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      user-select: none;
      transition: var(--transition);
    }

    th:hover {
      background: var(--th-hover);
      color: var(--accent-color);
    }

    #dataTable img {
      width: 48px;
      height: auto;
      border-radius: 2px;
      transition: var(--transition);
      padding: 4px;
    }

    #dataTable img:hover {
      transform: scale(2.5);
      z-index: 100;
      position: relative;

    }

    a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    tbody tr {
      animation: fadeIn 0.4s ease-out forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h2>One Hour One Life Foods</h2>
      <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">
        <svg id="moonIcon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg id="sunIcon" viewBox="0 0 24 24" style="display: none;">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </header>

    <table id="dataTable">
      <thead>
        <tr>
          <th onclick="sortTable('name')">Name</th>
          <th onclick="sortTable('value')">Value</th>
          <th onclick="sortTable('link')">Link</th>
          <th>Image</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      if (theme === 'dark') {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      } else {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      }
    }

    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    setTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    let data = [];
    let currentSort = { key: null, asc: true };

    // load JSON (make sure foods.json is in same folder)
    fetch("foods.json")
      .then((res) => res.json())
      .then((json) => {
        data = json;

        // default sort by value (ascending)
        data.sort((a, b) => a.value - b.value);
        currentSort = { key: "value", asc: true };

        renderTable(data);
      });

    function renderTable(data) {
      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = "";

      data.forEach((item) => {
        const row = document.createElement("tr");

        row.innerHTML = `
      <td>${item.name}</td>
      <td>${item.value}</td>
      <td><a href="https://onetech.info${item.link}" target="_blank">${item.link}</a></td>
      <td><img src="${item.image}"></td>
    `;

        tbody.appendChild(row);
      });
    }

    function sortTable(key) {
      if (currentSort.key === key) {
        currentSort.asc = !currentSort.asc;
      } else {
        currentSort.key = key;
        currentSort.asc = true;
      }

      data.sort((a, b) => {
        if (typeof a[key] === "number") {
          return currentSort.asc ? a[key] - b[key] : b[key] - a[key];
        } else {
          return currentSort.asc ? a[key].localeCompare(b[key]) : b[key].localeCompare(a[key]);
        }
      });

      renderTable(data);
    }
  </script>
</body>

</html>
